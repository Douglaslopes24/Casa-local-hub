name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android_app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp android_app/app/build/outputs/apk/debug/app-debug.apk CasaLocalHub-0.1.0.apk
          sha256sum CasaLocalHub-0.1.0.apk > CasaLocalHub-0.1.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CasaLocalHub-0.1.0
          path: |
            CasaLocalHub-0.1.0.apk
            CasaLocalHub-0.1.0.sha256

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CasaLocalHub-0.1.0.apk CasaLocalHub-0.1.0.sha256 --clobber
          else
            gh release create "$TAG" CasaLocalHub-0.1.0.apk CasaLocalHub-0.1.0.sha256 \
              --target "${GITHUB_SHA}" \
              --title "Casa Local Hub App 0.1.0" \
              --notes "Primeiro APK experimental do Casa Local Hub. Encontra o Core na LAN, pareia com código temporário, sincroniza chaves Tuya de forma criptografada e valida dispositivos localmente." \
              --prerelease
          fi
